name: Build resume

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: make verify PYTHON=python
      - uses: actions/upload-artifact@v7
        with:
          name: cameron-severn-resume
          path: output/pdf/cameron-severn-resume.pdf
